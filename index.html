<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta>


    <!-- link external bootstrap from cdn-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Vocabulary Word Guessing Game</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">
    <header class="text-white py-3 shadow-sm border-bottom">
        <div class="container text-center">
            <h1 class="h3 mb-0 text-muted">📚Vocabulary Word Guessing Game📚</h1>
        </div>
    </header>


    <!-- Main Content Area -->
    <main class="container my-auto py-4 text-center">

        <!-- game instructions -->
        <h3>Welcome to the Vocabulary Word Guessing Game!</h3>
        <p>Test your knowledge of English vocabulary by guessing words based on their definitions and clues.</p>

        <!-- start and exit buttons -->
        <a href="game.html" class="d-block my-5">
            <button class="btn btn-primary w-50" id="start-btn">Start Game</button>
        </a>
        <button class="btn btn-danger w-50" id="exit-btn">Exit Game</button>
        <h3 class="mt-3">High Score</h3>
        <p id="high-score" id="high-score" class="fs-5 fw-medium mt-1">0</p>

        <div class="d-none" id="score-element">
            <h3 class="mt-3">Your Score</h3>
            <p id="current-end-score" class="fs-5 fw-medium mt-1"></p>

        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-top py-3 text-center mt-auto">
        <div class="container">
            <small class="text-muted">Built with HTML5, CSS, Bootstrap 5, and Vanilla JavaScript</small>
            <p class="text-muted">&copy; 2026 516242@student.fontys.nl</p>
        </div>
    </footer>

</body>

</html>
<script src="script.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const scoreElem = document.getElementById('current-end-score');

    if (urlParams.get('action') === 'restart') {
        const startBtn = document.getElementById('start-btn');


        if (startBtn) {
            if (startBtn.innerText !== 'Restart Game') {
                startBtn.innerText = 'Restart Game';

                //display end-score
                document.getElementById('score-element').classList.remove('d-none')

            } else {
                startBtn.innerText = 'Start Game';
            }

        }

        if (scoreElem) {
            // Safely extracts the score, defaulting to '0' if undefined/null
            scoreElem.innerText = urlParams.get('score') ?? 0;

        }

    } else {
        scoreElem.innerText = 0;
    }

    //exit btn
    // EXIT GAME
    document.getElementById('exit-btn').onclick = () => {
        alert('close the page with Ctrl+w or cmd+w');
    };

    // set your end score element to d-block
</script>
