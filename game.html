<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Word Guessing Game</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Header -->
    <header class="border-bottom text-muted py-3 shadow-sm">
        <div class="container text-center">
            <h1 class="h3 mb-0">📚Vocabulary Word Guessing Game📚</h1>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="container my-auto py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <!-- Game Card -->
                <article class="card shadow-sm border-0">

                    <!-- Card Header / Score Board -->
                    <div class="card-header bg-white border-bottom-0 pt-4 px-4">
                        <div class="d-flex justify-content-between align-items-center">

                            <!-- <button id="quit-btn" class="btn btn-danger p-2 fs-6">Quit Game</button> -->
                            <div class="badge bg-danger p-1 fs-6" id="quit-btn">Quit Game</div>



                            <div class="badge bg-secondary p-1 fs-6">
                                Current Score: <span id="current-score" aria-live="polite">0</span>
                            </div>
                            <div class="badge bg-dark p-1 fs-6">
                                High Score: <span id="high-score" aria-live="polite">0</span>
                            </div>
                        </div>
                    </div>

                    <!-- Card Body / Game Screen -->
                    <div class="card-body p-4">

                        <!-- Dynamic Feedback Alert (Announced by Screen Readers) -->
                        <div id="game-feedback" class="alert alert-info d-none" role="status" aria-live="assertive">
                        </div>

                        <!-- Clues & Definition Section -->
                        <section aria-labelledby="definition-heading">
                            <h2 id="definition-heading" class="visually-hidden">Word Definition and Clues</h2>

                            <div class="mb-3">
                                <span class="text-uppercase text-muted fw-bold small">Definition</span>
                                <p id="word-definition" class="fs-5 fw-medium mt-1">Loading word definition...</p>
                            </div>

                            <div class="d-flex flex-wrap gap-2 mb-4" id="clues-container">
                                <span id="clue-start" class="badge text-bg-light border fs-6">Starts with: -</span>
                                <span id="clue-length" class="badge text-bg-light border fs-6">Length: -</span>
                                <span id="clue-attempts" class="badge text-bg-light border fs-6">Attempts remaining:
                                    3</span>
                            </div>
                        </section>

                        <!-- Guess Input Form -->
                        <form id="guess-form" novalidate>
                            <div class="mb-3">
                                <label for="user-guess" class="form-label fw-bold">Enter your guess:</label>
                                <input type="text" id="user-guess" class="form-control form-control-lg"
                                    autocomplete="off" aria-describedby="game-feedback" required>
                            </div>

                            <!-- Control Buttons -->
                            <div class="d-grid gap-2">
                                <button type="submit" id="submit-btn" class="btn btn-primary btn-lg">Submit
                                    Guess</button>
                                <button type="button" id="next-btn" class="btn btn-success btn-lg d-none">Next
                                    Word</button>
                                <button type="button" id="restart-btn" class="btn btn-danger btn-lg d-none">Restart
                                    Game</button>
                            </div>
                        </form>

                    </div>
                </article>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-top py-3 text-center mt-auto">
        <div class="container">
            <small class="text-muted">Built with HTML5, CSS, Bootstrap 5, and Vanilla JavaScript</small>
            <p class="">&copy; 2026 516242@student.fontys.nl</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
        </script>
    <!-- Custom Game Script -->
    <script src="script.js"></script>
</body>

</html>
